<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>-+*%$%*+-tvs for niki+*%$%*+-</title>
<link rel="stylesheet" href="assets/wall.css?v=6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

<main id="grid" class="grid" aria-label="Playlists"></main>

<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Now playing">
  <div id="stage-set" class="stage-set">
    <div class="cell-screen">
      <video id="stage" class="stage" playsinline controls preload="metadata"></video>
    </div>
    <div class="cell-frame" aria-hidden="true">
      <i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i>
      <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
    </div>
    <p id="stage-led" class="cell-led" aria-hidden="true"></p>
  </div>
  <div id="stage-nav" class="stage-nav">
    <button id="stage-prev" class="stage-btn" type="button" aria-label="Previous video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <p id="stage-index" class="stage-index" aria-live="polite"></p>
    <button id="stage-next" class="stage-btn" type="button" aria-label="Next video">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <button id="stage-close" class="stage-btn stage-close" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<script src="assets/wall.js?v=6"></script>
</body>
</html>
